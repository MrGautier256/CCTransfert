name: Tests et builds

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q

  build:
    name: Build ${{ matrix.os }}
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 : glibc plus ancienne, le binaire tourne sur plus de distributions.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.22.3 build
      - run: python packaging/build.py
      - name: Vérification de l'exécutable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=$(ls dist/cctransfert-cli-*.exe); else EXE=$(ls dist/CCTransfert-*-linux-*); fi
          python packaging/smoke_test.py "$EXE"
      - name: Wheel et archive des sources
        if: runner.os == 'Linux'
        run: python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: cctransfert-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true
      - name: Empreintes SHA256 (vérifiées par la mise à jour automatique)
        run: cd artefacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/releases/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artefacts/* --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" artefacts/* --title "CCTransfert ${TAG#v}" --notes-file "$NOTES"
          else
            gh release create "$TAG" artefacts/* --title "CCTransfert ${TAG#v}" --generate-notes
          fi
